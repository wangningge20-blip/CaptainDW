<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=750">
<title>貔貅 · 正面</title>
<link rel="stylesheet" href="card.css">
</head>
<body>
<div class="card card--pixiu front--new">
  <div class="front-media" style="background-image:url('assets/bg-pixiu.jpg')"></div>
  <div class="aura aura--new" style="--ax:60px;--ay:340px;--aw:650px;--ah:620px"></div>
  <div class="sun"></div>

  <img class="beast-art beast-art--glow" src="assets/pixiu.png" alt="" style="--bx:95px;--by:330px;--bw:500px">
  <img class="beast-art" src="assets/pixiu.png" alt="貔貅，有进无出 · 辟邪纳财" style="--bx:95px;--by:330px;--bw:500px">
  <div class="mist-front"></div>

  <div class="veil"></div>

  <div class="front-head">
    <div class="series">山海异兽录 <span class="dot"></span> <em>卷五 · 异兽</em></div>
    <div class="rank"><span>财</span></div>
  </div>

  <div class="title-veil"></div>

  <div class="front-title">
    <div class="eyebrow">No.10 · 雪岭金关</div>
    <h1>貔貅</h1>
    <p class="sub">有进无出 · 辟邪纳财</p>
    <div class="meta"><span>猛兽</span><i></i><span>财禄</span><i></i><span>辟邪</span></div>
  </div>

  <div class="seal">貔貅</div>

  <div class="corner corner--tl"></div>
  <div class="corner corner--tr"></div>
  <div class="corner corner--bl"></div>
  <div class="corner corner--br"></div>
  <div class="frame"></div>
  <div class="grain"></div>
</div>
</body>
</html>
